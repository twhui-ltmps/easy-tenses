<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Easy Tenses Kart Race 🏎️</title>
    <!-- Google Sign-in API -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <!-- Google Fonts for Racing Theme -->
    <link href="https://fonts.googleapis.com/css2?family=Titan+One&family=Nunito:wght@600;800;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --mario-red: #E52521;
            --luigi-green: #43B047;
            --peach-pink: #FF99CC;
            --bowser-orange: #FBD000;
            --toad-blue: #004B87;
            --sky-blue: #60a5fa;
            --track-grey: #4b5563;
            --coin-gold: #fbbf24;
            --text-dark: #1f2937;
            --text-light: #ffffff;
            --correct-bg: rgba(67, 176, 71, 0.2);
            --correct-border: #43B047;
            --wrong-bg: rgba(229, 37, 33, 0.2);
            --wrong-border: #E52521;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--sky-blue);
            background-image: 
                repeating-linear-gradient(45deg, rgba(255,255,255,0.1) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.1) 75%, rgba(255,255,255,0.1)),
                repeating-linear-gradient(45deg, rgba(255,255,255,0.1) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.1) 75%, rgba(255,255,255,0.1));
            background-position: 0 0, 20px 20px;
            background-size: 40px 40px;
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden; 
            touch-action: manipulation;
        }

        /* Racing Checkered Banner at the top/bottom */
        .checkered-banner {
            position: fixed;
            width: 100%;
            height: 20px;
            background: repeating-linear-gradient(90deg, #000, #000 20px, #fff 20px, #fff 40px);
            z-index: 1;
        }
        .banner-top { top: 0; left: 0; box-shadow: 0 4px 10px rgba(0,0,0,0.3);}
        .banner-bottom { bottom: 0; left: 0; box-shadow: 0 -4px 10px rgba(0,0,0,0.3);}

        /* Main Panel Container */
        .container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 24px;
            border: 6px solid var(--toad-blue);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3), inset 0 0 0 4px rgba(255,255,255,0.5);
            width: 100%;
            max-width: 600px;
            text-align: center;
            position: relative;
            z-index: 10;
            max-height: 90vh;
            overflow-y: auto;
            margin: 30px 15px;
        }

        h1 { 
            font-family: 'Titan One', cursive;
            color: var(--mario-red); 
            font-size: 32px;
            margin-top: 0; 
            text-shadow: 2px 2px 0px #000, -2px -2px 0px #fff, 0 4px 0px #990000;
            letter-spacing: 1px;
            line-height: 1.2;
        }

        h2 {
            font-family: 'Titan One', cursive;
            color: var(--toad-blue);
            font-size: 26px;
            text-shadow: 2px 2px 0px #fff;
            margin-bottom: 20px;
        }

        .screen { display: none; }
        .screen.active { display: block; animation: zoomIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @keyframes zoomIn {
            0% { opacity: 0; transform: scale(0.7); }
            100% { opacity: 1; transform: scale(1); }
        }

        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 900; color: var(--text-dark); font-size: 16px; }
        
        select, input[type="number"], input[type="text"] {
            width: 100%; padding: 12px 16px; border-radius: 12px; border: 3px solid var(--track-grey); 
            font-size: 16px; font-family: 'Nunito', sans-serif; box-sizing: border-box; 
            transition: all 0.3s; background: #f3f4f6; color: var(--text-dark);
            outline: none; font-weight: 800; cursor: pointer;
        }
        select:focus, input:focus { border-color: var(--mario-red); background: #fff; box-shadow: 0 0 0 4px rgba(229,37,33,0.2); }

        .btn {
            background: var(--luigi-green);
            color: #fff; 
            border: 3px solid #1f6b22;
            padding: 14px 20px;
            border-radius: 12px; 
            font-size: 18px; 
            font-family: 'Titan One', cursive;
            cursor: pointer; 
            margin: 8px 0; 
            width: 100%; 
            box-sizing: border-box; 
            box-shadow: 0 6px 0px #1f6b22;
            transition: all 0.1s ease;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .btn:hover { background: #50cc55; transform: translateY(2px); box-shadow: 0 4px 0px #1f6b22; }
        .btn:active { transform: translateY(6px); box-shadow: 0 0px 0px #1f6b22; }
        
        .btn.secondary { background: var(--bowser-orange); border-color: #b39500; color: #665500; box-shadow: 0 6px 0px #b39500; text-shadow: 1px 1px 0px rgba(255,255,255,0.5);}
        .btn.secondary:hover { background: #ffdf33; transform: translateY(2px); box-shadow: 0 4px 0px #b39500; }
        .btn.secondary:active { transform: translateY(6px); box-shadow: 0 0px 0px #b39500; }
        
        .btn.rank-btn { background: var(--mario-red); border-color: #990000; color: #fff; box-shadow: 0 6px 0px #990000; }
        .btn.rank-btn:hover { background: #ff3333; transform: translateY(2px); box-shadow: 0 4px 0px #990000; }
        .btn.rank-btn:active { transform: translateY(6px); box-shadow: 0 0px 0px #990000; }

        .btn.outline-btn { background: #e5e7eb; border: 3px solid #9ca3af; color: #4b5563; font-family: 'Nunito'; font-weight: 900; box-shadow: 0 4px 0px #9ca3af;}
        .btn.outline-btn:hover { background: #d1d5db; transform: translateY(2px); box-shadow: 0 2px 0px #9ca3af;}
        .btn.outline-btn:active { transform: translateY(4px); box-shadow: 0 0px 0px #9ca3af;}

        .stats-bar {
            display: flex; justify-content: space-between; background: var(--text-dark); 
            border: 3px solid var(--track-grey); padding: 12px 15px; border-radius: 12px; 
            font-size: 16px; font-family: 'Titan One', cursive; margin-bottom: 20px; color: #fff;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        /* Question Box Styling */
        .question-box {
            font-size: 22px; font-weight: 900; margin: 10px 0 20px 0; color: var(--text-dark); 
            min-height: 100px; display: flex; align-items: center; justify-content: center; text-align: center;
            background: #fff; border: 4px dashed var(--bowser-orange); border-radius: 16px;
            padding: 25px 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            line-height: 1.6;
        }

        .blank-space {
            color: var(--mario-red);
            font-weight: 900;
            letter-spacing: 2px;
        }

        .choices-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        /* Choice Buttons */
        .choice-btn {
            background: #fff;
            border: 3px solid var(--toad-blue);
            border-radius: 12px;
            padding: 16px 10px;
            font-size: 18px;
            font-family: 'Nunito', sans-serif;
            font-weight: 900;
            color: var(--toad-blue);
            cursor: pointer;
            transition: all 0.1s;
            box-shadow: 0 4px 0 var(--toad-blue);
            user-select: none;
            touch-action: manipulation;
        }
        .choice-btn:hover {
            background: #eef2ff;
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--toad-blue);
        }
        .choice-btn:active { transform: translateY(4px); box-shadow: none; }

        @keyframes bumpCorrect { 
            0% { transform: scale(1); }
            50% { transform: scale(1.05); background-color: var(--correct-bg); border-color: var(--correct-border); }
            100% { transform: scale(1); background-color: var(--correct-bg); border-color: var(--correct-border); }
        }
        @keyframes spinWrong {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px) rotate(-2deg); background-color: var(--wrong-bg); border-color: var(--wrong-border);}
            75% { transform: translateX(5px) rotate(2deg); background-color: var(--wrong-bg); border-color: var(--wrong-border);}
            100% { transform: translateX(0); background-color: var(--wrong-bg); border-color: var(--wrong-border);}
        }
        .feedback-correct { animation: bumpCorrect 0.3s ease forwards; }
        .feedback-wrong { animation: spinWrong 0.4s ease forwards; }

        .table-container { max-height: 320px; overflow-y: auto; border-radius: 12px; border: 3px solid var(--track-grey); background: #fff;}
        table { width: 100%; border-collapse: collapse; color: var(--text-dark); }
        th, td { border-bottom: 2px solid #f3f4f6; padding: 12px 10px; text-align: center; font-size: 16px; font-weight: 800;}
        th { background-color: var(--toad-blue); color: #fff; position: sticky; top: 0; font-family: 'Titan One', cursive; font-size: 14px; letter-spacing: 0.5px; border-bottom: none;}
        tr:nth-child(even) { background-color: #f9fafb; }
        tr:hover { background-color: #fef08a; }

        .leaderboard-filters { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
        .leaderboard-filters select { flex: 1; min-width: 140px; }

        .auth-section {
            background: #f8fafc; border: 3px dashed var(--mario-red); border-radius: 16px;
            padding: 15px; margin-bottom: 20px;
        }

        /* Custom Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); display: none; justify-content: center; align-items: center;
            z-index: 1000; backdrop-filter: blur(3px);
        }
        .modal-box {
            background: #fff; padding: 25px; border-radius: 20px; border: 5px solid var(--mario-red);
            width: 90%; max-width: 440px; text-align: center; font-family: 'Nunito', sans-serif;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); animation: zoomIn 0.2s ease-out forwards;
        }
        .modal-title { font-family: 'Titan One', cursive; font-size: 24px; color: var(--text-dark); margin-bottom: 15px; }
        .modal-msg { font-size: 17px; font-weight: 800; margin-bottom: 20px; color: var(--track-grey); line-height: 1.5; }
        .modal-buttons { display: flex; gap: 10px; justify-content: center; }

        .tip-box {
            background: #f0fdf4;
            border: 2px dashed var(--luigi-green);
            border-radius: 12px;
            padding: 10px 12px;
            margin-top: 10px;
            font-size: 14px;
            text-align: left;
            color: var(--text-dark);
            line-height: 1.4;
        }

        /* Scrollbar styles */
        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: #f3f4f6; border-radius: 5px; }
        ::-webkit-scrollbar-thumb { background: var(--track-grey); border-radius: 5px; }
    </style>
</head>
<body>

    <div class="checkered-banner banner-top"></div>
    
    <!-- Custom Modal System -->
    <div class="modal-overlay" id="custom-modal">
        <div class="modal-box">
            <div class="modal-title" id="modal-title">System Message</div>
            <div class="modal-msg" id="modal-msg">Message here</div>
            <div class="modal-buttons" id="modal-buttons">
                <!-- Buttons injected via JS -->
            </div>
        </div>
    </div>

    <div class="container" id="app-container">
        
        <!-- Menu Screen -->
        <div id="menu-screen" class="screen active">
            <h1>🏎️ Easy Tenses Kart Race 🏁</h1>
            
            <div class="auth-section">
                <div id="google-btn-container" style="display: flex; justify-content: center; min-height: 40px;"></div>
                <div id="user-welcome" style="display: none; color: var(--luigi-green); font-family: 'Titan One', cursive; font-size: 18px; text-shadow: 1px 1px 0px rgba(0,0,0,0.1);"></div>
                <p id="login-hint" style="margin: 8px 0 0; color: var(--track-grey); font-size: 14px; font-weight: 800;">[ PIT STOP: Login to save your lap times! ]</p>
            </div>

            <div class="form-group">
                <label>🏎️ Select Track (Level):</label>
                <select id="question-type">
                    <option value="level1">🍄 Level 1: Present Continuous Tense</option>
                    <option value="level2">⭐️ Level 2: Modal Verbs / No Change of Verb</option>
                    <option value="level3">🌈 Level 3: Mixed Tenses</option>
                </select>
            </div>
            
            <button class="btn" onclick="startGame('infinite')">♾️ Free Practice (Endless)</button>
            <button class="btn rank-btn" onclick="startGame('timed')">⏱️ Time Trials (3-Min Race)</button>
            
            <div style="margin-top: 15px; display: flex; flex-direction: column; gap: 5px;">
                <button class="btn secondary" onclick="showLeaderboard()">🏆 Racing Leaderboard</button>
            </div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen">
            <div class="stats-bar">
                <span id="time-display" style="color: var(--coin-gold);">Time: 03:00</span>
                <span id="score-display" style="display: none; color: var(--peach-pink);">Score: 0</span>
                <span id="progress-display" style="color: var(--luigi-green);">Laps: 0/0</span>
            </div>
            <div id="level-display" style="color: var(--toad-blue); font-family: 'Titan One', cursive; margin-bottom:10px; font-size: 20px;"></div>
            
            <div class="question-box" id="question-text">
                Mission text...
            </div>
            
            <!-- Multiple Choice Grid -->
            <div id="choices-container" class="choices-grid">
                <!-- Buttons injected via JS -->
            </div>

            <button class="btn outline-btn" onclick="requestExit()">🛑 Pit Stop (Quit Race)</button>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="screen">
            <h2>🏁 Race Finished! 🏁</h2>
            <div id="final-stats" style="font-size: 18px; font-weight: 900; line-height: 1.8; margin-bottom: 20px; background: #f3f4f6; padding: 15px; border-radius: 16px; border: 3px solid var(--track-grey);"></div>
            
            <div id="upload-section" class="form-group" style="display: none; background: #fff; padding: 20px; border-radius: 16px; border: 4px solid var(--bowser-orange);">
                <label style="color: var(--text-dark); text-align: center; font-size: 18px;">Upload Race Data</label>
                
                <div style="text-align: center; margin-bottom: 15px; font-size: 16px; font-weight: 800;">
                    Racer: <span id="upload-name-display" style="color: var(--toad-blue); font-family: 'Titan One', cursive;"></span>
                </div>

                <div style="display: flex; gap: 10px; margin-bottom: 10px;">
                    <select id="class-select" style="flex: 1;">
                        <option value="2A">Kart 2A</option>
                        <option value="2B">Kart 2B</option>
                        <option value="2C">Kart 2C</option>
                        <option value="2D">Kart 2D</option>
                        <option value="2E">Kart 2E</option>
                    </select>
                    <input type="number" id="student-num" placeholder="Class No. (1-40)" min="1" max="40" style="flex: 2;">
                </div>
                <button class="btn rank-btn" id="submit-score-btn" onclick="submitScore()">Submit Score 📡</button>
            </div>
            
            <button class="btn secondary" onclick="showScreen('menu-screen')">Back to Garage</button>
        </div>

        <!-- Leaderboard Screen -->
        <div id="leaderboard-screen" class="screen">
            <h2>🏆 Hall of Fame</h2>
            <div class="leaderboard-filters">
                <select id="filter-mode" onchange="fetchLeaderboard()">
                    <option value="timed_level1">🍄 Level 1: Present Continuous</option>
                    <option value="timed_level2">⭐️ Level 2: Modal Verbs</option>
                    <option value="timed_level3">🌈 Level 3: Mixed</option>
                </select>
                
                <select id="filter-class" onchange="fetchLeaderboard()">
                    <option value="ALL">🌎 All Racers</option>
                    <option value="2A">2A</option>
                    <option value="2B">2B</option>
                    <option value="2C">2C</option>
                    <option value="2D">2D</option>
                    <option value="2E">2E</option>
                </select>
            </div>
            <div class="table-container">
                <table id="leaderboard-table">
                    <thead>
                        <tr>
                            <th>Rank</th>
                            <th>Class</th>
                            <th>No.</th>
                            <th>Racer Name</th>
                            <th>Score</th>
                            <th>Acc.</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body"></tbody>
                </table>
            </div>
            <br>
            <button class="btn secondary" onclick="showScreen('menu-screen')">Back</button>
        </div>

    </div>
    
    <div class="checkered-banner banner-bottom"></div>

    <!-- Custom UI Modals -->
    <script>
        function showModal(title, msg, type = 'alert', onConfirm = null) {
            const overlay = document.getElementById('custom-modal');
            const titleEl = document.getElementById('modal-title');
            const msgEl = document.getElementById('modal-msg');
            const btns = document.getElementById('modal-buttons');
            
            titleEl.innerHTML = title;
            msgEl.innerHTML = msg;
            btns.innerHTML = '';
            
            if (type === 'alert') {
                const btn = document.createElement('button');
                btn.className = 'btn';
                btn.innerText = 'OK';
                btn.onclick = () => { overlay.style.display = 'none'; };
                btns.appendChild(btn);
            } else if (type === 'confirm') {
                const yesBtn = document.createElement('button');
                yesBtn.className = 'btn rank-btn';
                yesBtn.innerText = 'Yes, Quit';
                yesBtn.onclick = () => { overlay.style.display = 'none'; if(onConfirm) onConfirm(); };
                
                const noBtn = document.createElement('button');
                noBtn.className = 'btn outline-btn';
                noBtn.innerText = 'Keep Racing';
                noBtn.onclick = () => { overlay.style.display = 'none'; };
                
                btns.appendChild(yesBtn);
                btns.appendChild(noBtn);
            }
            overlay.style.display = 'flex';
        }
    </script>

    <!-- Google Login Logic -->
    <script>
        let currentUser = null; 
        function parseJwt(token) {
            try {
                return JSON.parse(decodeURIComponent(window.atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')).split('').map(function(c) {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join('')));
            } catch (e) { return null; }
        }

        function handleCredentialResponse(response) {
            const payload = parseJwt(response.credential);
            if(payload) {
                currentUser = { id: payload.sub, lastName: payload.family_name || payload.name || "Racer" };
                document.getElementById('google-btn-container').style.display = 'none';
                document.getElementById('login-hint').style.display = 'none';
                const welcomeEl = document.getElementById('user-welcome');
                welcomeEl.innerText = `🏎️ Ready, Racer ${currentUser.lastName}!`;
                welcomeEl.style.display = 'block';
            }
        }

        window.onload = function () {
            google.accounts.id.initialize({
                client_id: "623171860819-1fldq3op0pmilgapk5o2j9c3f8oa7d39.apps.googleusercontent.com",
                callback: handleCredentialResponse
            });
            google.accounts.id.renderButton(
                document.getElementById("google-btn-container"),
                { theme: "outline", size: "large", shape: "pill", width: 250 }
            );
        };
    </script>

    <!-- Firebase Logic -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-analytics.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, query, where, orderBy, limit } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDUODAImoAOc-o9sgOrhOYz1kImZcg3cqI",
            authDomain: "test-7f93c.firebaseapp.com",
            projectId: "test-7f93c",
            storageBucket: "test-7f93c.firebasestorage.app",
            messagingSenderId: "623171860819",
            appId: "1:623171860819:web:587304c09b0e8bfcebc9a6",
            measurementId: "G-S68W1EQDYS"
        };

        const app = initializeApp(firebaseConfig);
        const analytics = getAnalytics(app);
        const db = getFirestore(app);

        window.saveToFirebase = async (data) => {
            const btn = document.getElementById('submit-score-btn');
            try {
                btn.innerText = "Transmitting... 📡";
                btn.disabled = true;
                const docId = `${data.googleId}_timed_${data.questionType}`;
                const docRef = doc(db, "2627p2_easytenses", docId);
                const docSnap = await getDoc(docRef);
                
                if (docSnap.exists() && data.score <= docSnap.data().score) {
                    showModal("🐢 Too Slow!", `Your top Score in this Cup is ${docSnap.data().score}. You didn't beat your record.`);
                    btn.innerText = "Submit Score 📡";
                    btn.disabled = false;
                    return;
                }
                
                await setDoc(docRef, { ...data, gameMode: "timed", timestamp: new Date() }, { merge: true });
                showModal("⭐️ New Record!", "Score saved successfully! Check the Hall of Fame.");
                document.getElementById('filter-mode').value = `timed_${data.questionType}`;
                showScreen('leaderboard-screen');
                fetchLeaderboard();
            } catch (e) {
                console.error(e);
                showModal("🍌 Slip Up!", "Error saving data. Please check your internet connection.");
            } finally {
                btn.innerText = "Submit Score 📡";
                btn.disabled = false;
            }
        };

        window.fetchLeaderboard = async () => {
            const tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = "<tr><td colspan='6'>Fetching records... 🏎️💨</td></tr>";
            const qType = document.getElementById('filter-mode').value.split('_')[1]; 
            const cls = document.getElementById('filter-class').value;
            
            let conds = [where("gameMode", "==", "timed"), where("questionType", "==", qType)];
            if (cls !== "ALL") conds.push(where("class", "==", cls));

            try {
                const q = query(collection(db, "2627p2_easytenses"), ...conds, orderBy("score", "desc"), limit(30));
                const snap = await getDocs(q);
                tbody.innerHTML = snap.empty ? "<tr><td colspan='6'>No records found in this Cup.</td></tr>" : "";
                
                let rank = 1;
                snap.forEach((doc) => {
                    const d = doc.data();
                    let rDisp = rank === 1 ? "🥇" : rank === 2 ? "🥈" : rank === 3 ? "🥉" : rank;
                    tbody.innerHTML += `
                        <tr>
                            <td style="font-weight:900;">${rDisp}</td>
                            <td>${d.class}</td>
                            <td>${d.studentNum}</td>
                            <td style="font-family:'Titan One'; color:var(--toad-blue);">${d.lastName}</td>
                            <td style="color:var(--mario-red); font-weight:900;">${d.score}</td>
                            <td>${d.accuracy}%</td>
                        </tr>`;
                    rank++;
                });
            } catch (e) { 
                console.error(e);

            const pattern = /\b(let's|can|cannot|can't|must|mustn't|right now|now|at the moment|Look|Listen|today|this morning)\b/i;
            const match = text.match(pattern);
            return match ? match[0] : null;
        }

        function getBeVerbTip(questionText, selectedAns, correctAns) {
            const matchBe = (str) => {
                const m = str.match(/\b(am|is|are)\b/i);
                return m ? m[0].toLowerCase() : null;
            };

            const selBe = matchBe(selectedAns);
            const corrBe = matchBe(correctAns);

            if (!selBe || !corrBe || selBe === corrBe) return null;

            let subj = "Subject";
            if (/^(Look!|Listen!)/i.test(questionText.trim())) {
                const afterExcl = questionText.replace(/^(Look!|Listen!)\s*/i, '');
                subj = afterExcl.split('_____')[0].trim();
            } else {
                subj = questionText.split('_____')[0].trim();
            }

            return `⚠️ <b>Verb 'to be' tip:</b><br><b style="color:var(--toad-blue);">${subj}</b> ➔ ✔️ <b>${corrBe}</b> &nbsp;/&nbsp; ❌ <s>${selBe}</s>`;

        const config = {

        };

        let mode, typeLevel, timer, timeLeft;
        let stats = { total: 0, correct: 0, score: 0 };
        let currQ = null;

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        function showLeaderboard() {
            showScreen('leaderboard-screen');
            if(window.fetchLeaderboard) window.fetchLeaderboard();
        }

        function requestExit() {
            showModal("🛑 Pit Stop!", "Are you sure you want to quit the race? Data will be lost!", "confirm", () => {
                clearInterval(timer);
                showScreen('menu-screen');
            });
        }

        function startGame(selectedMode) {
            if (selectedMode === 'timed' && !currentUser) {
                showModal("PIT STOP", "You must login with Google to race in Time Trials!");
                return;
            }

            mode = selectedMode;
            typeLevel = document.getElementById('question-type').value;
            stats = { total: 0, correct: 0, score: 0 };
            
            document.getElementById('score-display').style.display = (mode === 'timed') ? 'inline' : 'none';
            document.getElementById('level-display').innerText = config[typeLevel].name;
            updateStatsUI();
            
            if (mode === 'infinite') {
                document.getElementById('time-display').innerText = "Mode: Free Practice";
                clearInterval(timer);
            } else {
                timeLeft = 180; // 3 mins
                updateTimeUI();
                clearInterval(timer);
                timer = setInterval(() => {
                    timeLeft--; updateTimeUI();
                    if(timeLeft <= 0) { clearInterval(timer); endGame(); }
                }, 1000);
            }
            showScreen('game-screen');
            generateQuestion();
        }

        function updateTimeUI() {
            document.getElementById('time-display').innerText = `Time: ${Math.floor(timeLeft/60)}:${(timeLeft%60).toString().padStart(2,'0')}`;
            document.getElementById('time-display').style.color = (timeLeft <= 10 && mode !== 'infinite') ? 'var(--mario-red)' : 'var(--coin-gold)';
        }

        function generateQuestion() {
            const bank = config[typeLevel].bank;
            currQ = bank[Math.floor(Math.random() * bank.length)];
            
            let formattedQ = currQ.q.replace(/_____/g, '<span class="blank-space">_____</span>');

            document.getElementById('question-text').innerHTML = '<span>' + formattedQ + '</span>';
            
            let options = [currQ.a, ...currQ.w].sort(() => Math.random() - 0.5);
            const container = document.getElementById('choices-container');
            container.innerHTML = '';
            
            options.forEach(opt => {
                let btn = document.createElement('button');
                btn.className = 'choice-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(opt);
                container.appendChild(btn);
            });
        }

        function checkAnswer(ans) {
            stats.total++;
            const c = document.getElementById('app-container');
            c.classList.remove('feedback-correct', 'feedback-wrong');
            void c.offsetWidth; 
            
            if (ans === currQ.a) {
                stats.correct++;
                if(mode === 'timed') stats.score += config[typeLevel].pts;
                c.classList.add('feedback-correct');
            } else {
                if(mode === 'timed') stats.score = Math.max(0, stats.score - 5);
                c.classList.add('feedback-wrong');
                
                const indicator = getTimeIndicator(currQ.q);
                let indicatorTip = indicator 
                    ? `⏰ <b>Keyword:</b> <i>"${indicator}"</i> helps you pick the right verb form.`
                    : `⏰ <b>Rule Tip:</b> After modal words like <i>can</i>, <i>must</i>, or <i>let's</i>, do NOT change the verb!`;

                let beVerbTip = getBeVerbTip(currQ.q, ans, currQ.a);
                let beVerbHtml = beVerbTip ? `<div class="tip-box">${beVerbTip}</div>` : '';

                let modalBody = `
                    The correct answer was:<br>
                    <b style="color:var(--mario-red); font-size:22px;">${currQ.a}</b>
                    <div class="tip-box" style="margin-top:15px;">
                        ${indicatorTip}
                    </div>
                    ${beVerbHtml}
                `;

                showModal("🍌 Whoops!", modalBody);
            }
            setTimeout(() => c.classList.remove('feedback-correct', 'feedback-wrong'), 400);
            updateStatsUI();
            generateQuestion();
        }

        function updateStatsUI() {
            let acc = stats.total ? Math.round((stats.correct/stats.total)*100) : 0;
            document.getElementById('progress-display').innerText = `Laps: ${stats.correct}/${stats.total} (${acc}%)`;
            document.getElementById('score-display').innerText = `Score: ${stats.score}`;
        }

        function endGame() {
            showScreen('result-screen');
            let acc = stats.total ? Math.round((stats.correct/stats.total)*100) : 0;
            let html = `Total Questions: <b style="color:var(--toad-blue)">${stats.total}</b><br>
                        Correct: <b style="color:var(--luigi-green)">${stats.correct}</b><br>
                        Accuracy: <b style="color:var(--bowser-orange)">${acc}%</b><br>`;
            
            if (mode === 'timed' && currentUser) {
                html += `<hr style="border-top:2px dashed var(--track-grey); margin:15px 0;">
                         <span style="color:var(--mario-red); font-size:24px; font-family:'Titan One'; text-transform:uppercase;">FINAL SCORE: ${stats.score}</span>`;
                document.getElementById('upload-section').style.display = 'block';
                document.getElementById('upload-name-display').innerText = currentUser.lastName;
            } else {
                document.getElementById('upload-section').style.display = 'none';
            }
            document.getElementById('final-stats').innerHTML = html;
        }

        function submitScore() {
            const stuClass = document.getElementById('class-select').value;
            const stuNum = document.getElementById('student-num').value;
            if(!stuNum || stuNum < 1 || stuNum > 40) return showModal("Hold on!", "Please enter a valid Class Number (1-40).");
            
            if(window.saveToFirebase) {
                window.saveToFirebase({
                    class: stuClass,
                    studentNum: parseInt(stuNum),
                    lastName: currentUser.lastName,
                    googleId: currentUser.id,
                    score: stats.score,
                    accuracy: stats.total ? Math.round((stats.correct/stats.total)*100) : 0,
                    questionType: typeLevel 
                });
            }
